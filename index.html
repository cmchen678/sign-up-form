<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <section class="logo-section">
            <div class="logo-container">
                <img src="images/odin-lined.png" alt="odin-logo" class="logo-img">
                <p class="logo-text">Odin</p>
            </div>
        </section>
        <section class="form-section">
            <div class="form-header">
                <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.</p>
                <p>You <em>know</em> you want to.</p>
            </div>
            <form class="form-main">
                <p>Let's do this!</p>
                <div class="form-row">
                    <div class="input-column">
                        <label for="user_name">First Name</label>
                        <input type="text" id="user_name" name="user_name">
                    </div>
                    <div class="input-column">
                        <label for="user_lastname">Last Name</label>
                        <input type="text" id="user_last_name" name="user_last_name">
                    </div>
                </div>
                <div class="form-row">
                    <div class="input-column">
                        <label for="user_email">Email</label>
                        <input type="email" id="user_email" name="user_email">
                    </div>
                    <div class="input-column">
                        <label for="user_phone">Phone Number</label>
                        <input type="tel" id="user_phone" name="user_phone">
                    </div>
                </div>
                <div class="form-row">
                    <div class="input-column">
                        <label for="user_pwd">Password</label>
                        <input type="password" id="user_pwd" name="user_pwd" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[\W_]).{8,}" title="Must contain at least one number, one uppercase, one lowercase letter, one special character, and at least 8 characters." required>
                    </div>
                    <div class="input-column">
                        <label for="confirm_pwd">Confirm Password</label>
                        <input type="password" id="confirm_pwd" name="confirm_pwd" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[\W_]).{8,}" title="Must contain at least one number, one uppercase, one lowercase letter, one special character, and at least 8 characters." required>
                    </div>
                </div>
            </form>
            <div class="form-footer">
                <form class="form-button">
                    <button action="" method="POST" class="submit-button">Create Account</button>
                </form>
                <p>Already have an account? <a href="">Log In</a></p>
            </div>
        </section>
    </div>
</body>
</html>
